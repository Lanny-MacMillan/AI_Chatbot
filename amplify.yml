version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify env vars aren't visible to the SSR runtime, so write them to .env.production
        - env | grep -E '^(OPENAI_API_KEY|AUTH0_)' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
